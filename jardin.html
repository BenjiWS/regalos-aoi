<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un jardín para Aoi 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #ffb7a8;
    --sky-mid: #f8a5c2;
    --sky-low: #b39ddb;
    --dusk-top: #2d1b4e;
    --dusk-mid: #6a3a7a;
    --dusk-low: #e27d9b;
    --card: rgba(255, 255, 255, .78);
    --ink: #5b2a4a;
    --accent: #e0457b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background: #f8a5c2;
    -webkit-tap-highlight-color: transparent;
  }

  /* Cielo: día → atardecer */
  .sky, .sky-dusk { position: fixed; inset: 0; z-index: 0; }
  .sky { background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-low) 100%); }
  .sky-dusk {
    background: linear-gradient(180deg, var(--dusk-top) 0%, var(--dusk-mid) 55%, var(--dusk-low) 100%);
    opacity: 0; transition: opacity 8s ease;
  }
  body.dusk .sky-dusk { opacity: 1; }

  .sun {
    position: fixed; left: 50%; bottom: 18vh; z-index: 0;
    width: min(38vw, 220px); aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, #fff3c4 0%, #ffd27a 55%, rgba(255,180,120,0) 72%);
    transition: bottom 9s ease, opacity 9s ease;
  }
  body.dusk .sun { bottom: -30vh; opacity: .3; }

  .cloud {
    position: fixed; z-index: 1; pointer-events: none;
    width: 160px; height: 48px; border-radius: 50px;
    background: rgba(255,255,255,.7);
    filter: blur(1px);
    animation: drift linear infinite;
    transition: opacity 6s;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 70px; height: 70px; top: -34px; left: 26px; }
  .cloud::after  { width: 56px; height: 56px; top: -24px; left: 80px; }
  body.dusk .cloud { opacity: .25; }
  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 220px)); } }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; }

  .scene {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
    opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 1.2s;
  }
  .scene.active { opacity: 1; visibility: visible; }

  /* ---------- Escena 1 ---------- */
  .hello {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(3.4rem, 15vw, 7rem);
    color: #fff;
    text-shadow: 0 4px 24px rgba(224,69,123,.45);
  }
  .hello span {
    display: inline-block; opacity: 0;
    transform: translateY(30px) rotate(-8deg);
    animation: pop .9s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .sub {
    margin-top: 8px; font-size: clamp(1.05rem, 4vw, 1.3rem); color: #fff;
    opacity: 0; animation: fadeUp 1.2s ease 1.8s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .btn {
    font-family: inherit; font-weight: 600; font-size: 1.1rem;
    border: none; border-radius: 999px; padding: 13px 30px; cursor: pointer;
    color: #fff; background: var(--accent);
    box-shadow: 0 8px 22px rgba(224,69,123,.4);
    transition: transform .25s, box-shadow .25s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(224,69,123,.55); }
  #startBtn { margin-top: 34px; opacity: 0; animation: fadeUp 1s ease 2.6s forwards; }

  /* ---------- Escena 2: mensajes sobre el jardín ---------- */
  #garden { justify-content: flex-start; padding-top: 12vh; pointer-events: none; }
  .msg {
    max-width: 560px;
    font-family: 'Dancing Script', cursive; font-weight: 500;
    font-size: clamp(1.7rem, 6.5vw, 2.6rem); line-height: 1.3;
    color: #fff; text-shadow: 0 2px 16px rgba(60,20,60,.45);
    opacity: 0; transform: translateY(14px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  .msg.show { opacity: 1; transform: none; }

  /* ---------- Escena 3: pregunta ---------- */
  .card {
    position: relative;
    width: min(460px, 100%);
    background: var(--card);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 24px; padding: 34px 26px 30px;
    box-shadow: 0 20px 60px rgba(40,10,50,.35);
    transform: scale(.85); transition: transform .9s cubic-bezier(.2,1.3,.4,1);
  }
  .scene.active .card { transform: none; }
  .card .flower { font-size: 3rem; display: block; animation: sway 3s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .card h2 {
    font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 8vw, 2.6rem);
    color: var(--accent); margin: 8px 0 6px;
  }
  .card p { font-size: 1.15rem; line-height: 1.5; }
  .answers {
    position: relative; margin-top: 26px; height: 64px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  #yesBtn { transition: transform .3s cubic-bezier(.2,1.4,.4,1), box-shadow .25s; }
  #noBtn {
    background: #fff; color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    transition: left .35s ease, top .35s ease;
  }
  #noBtn.runaway { position: fixed; z-index: 20; }

  /* ---------- Escena 4: final ---------- */
  .final-title {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(2.8rem, 12vw, 5.5rem); color: #fff;
    text-shadow: 0 0 22px rgba(255,140,180,.8);
  }
  .final-text {
    margin-top: 14px; max-width: 520px;
    font-size: clamp(1.1rem, 4.2vw, 1.35rem); line-height: 1.6; color: #ffe6f0;
  }
  .sign { margin-top: 18px; font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #ffd6a5; }
  #final > * { opacity: 0; }
  #final.active > * { animation: fadeUp 1.4s ease forwards; }
  #final.active > :nth-child(2) { animation-delay: 1s; }
  #final.active > :nth-child(3) { animation-delay: 2.2s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="sky-dusk"></div>
<div class="sun"></div>
<div class="cloud" style="top:10vh; animation-duration:60s; animation-delay:-20s"></div>
<div class="cloud" style="top:22vh; transform:scale(.7); animation-duration:80s; animation-delay:-50s"></div>
<div class="cloud" style="top:5vh; animation-duration:95s; animation-delay:-5s"></div>
<canvas id="c"></canvas>

<!-- 1. Saludo -->
<section class="scene active" id="intro">
  <h1 class="hello" id="hello"></h1>
  <p class="sub">plantaré algo bonito para ti…</p>
  <button class="btn" id="startBtn">Ver el jardín 🌷</button>
</section>

<!-- 2. Jardín -->
<section class="scene" id="garden">
  <p class="msg" id="msg"></p>
</section>

<!-- 3. Pregunta -->
<section class="scene" id="question">
  <div class="card">
    <span class="flower">🌸</span>
    <h2>Aoi…</h2>
    <p id="questionText"></p>
    <div class="answers">
      <button class="btn" id="yesBtn">Sí 💖</button>
      <button class="btn" id="noBtn">No</button>
    </div>
  </div>
</section>

<!-- 4. Final -->
<section class="scene" id="final">
  <div class="final-title">¡Sabía que dirías que sí!</div>
  <p class="final-text" id="finalText"></p>
  <div class="sign" id="sign"></div>
</section>

<script>
/* ================= Texto (edítalo a tu gusto) ================= */
const NAME = "Aoi";
const MESSAGES = [
  "Cada flor de este jardín es un momento que he vivido contigo…",
  "…las risas, las charlas largas, los silencios cómodos.",
  "Todo lo bonito de mi vida florece desde que llegaste tú.",
  "Así que tengo una pregunta importante para ti…"
];
const QUESTION = "¿Quieres seguir cuidando este jardín conmigo, hoy y siempre?";
const NO_TEXTS = ["¿Segura?", "Piénsalo bien 🥺", "¡Casi!", "No vale 😤", "Inténtalo otra vez", "¡Jamás me alcanzarás!"];
const FINAL_TEXT = "Prometo regarte de cariño todos los días, abrazarte en los días nublados y celebrar contigo cada primavera. Eres mi flor favorita.";
const SIGN = "Te quiero muchísimo ♥";

/* ================= Canvas ================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', () => { resize(); if (grass.length) makeGrass(); });
resize();

const PALETTE = [
  ['#ff6f91', '#ffc75f'], ['#f9a8d4', '#fde68a'], ['#c084fc', '#fef3c7'],
  ['#fb7185', '#fff1b8'], ['#ffffff', '#f59e0b'], ['#f472b6', '#fcd34d'],
  ['#fda4af', '#fbbf24'], ['#a78bfa', '#fde68a']
];
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- Flores ---------- */
let flowers = [];
function plantFlowers() {
  flowers = [];
  const n = Math.max(9, Math.floor(W / 55));
  for (let i = 0; i < n; i++) {
    const [petal, center] = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    flowers.push({
      x: (i + .5) / n * W + rand(-18, 18),
      h: rand(H * .18, H * .45),
      bend: rand(-40, 40),
      grow: 0, bloom: 0,
      delay: rand(0, 3.5) + i * .12,
      speed: rand(.35, .6),
      petals: Math.floor(rand(5, 9)),
      size: rand(16, 30),
      petal, center,
      phase: rand(0, Math.PI * 2),
      leafSide: Math.random() < .5 ? -1 : 1
    });
  }
  flowers.sort((a, b) => a.h - b.h);
}

function drawLeaf(x, y, ang, len) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#5fa36a';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * .5, -len * .45, len, 0);
  ctx.quadraticCurveTo(len * .5, len * .45, 0, 0);
  ctx.fill();
  ctx.restore();
}

function drawFlower(f, t, dt) {
  if (t < f.delay) return;
  if (f.grow < 1) f.grow = Math.min(1, f.grow + dt * f.speed);
  else if (f.bloom < 1) f.bloom = Math.min(1, f.bloom + dt * .8);

  const g = easeOut(f.grow);
  const sway = Math.sin(t * 1.2 + f.phase) * 8;
  const baseX = f.x, baseY = H + 4;
  const topX = f.x + (f.bend + sway) * g;
  const topY = H - f.h * g;
  const cX = f.x + f.bend * .2 * g, cY = H - f.h * .55 * g;

  // tallo
  ctx.strokeStyle = '#4e8f5a';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(cX, cY, topX, topY);
  ctx.stroke();

  // hoja
  if (f.grow > .45) {
    const k = easeOut(Math.min(1, (f.grow - .45) / .4));
    const lx = (baseX + 2 * cX + topX) / 4, ly = (baseY + 2 * cY + topY) / 4;
    drawLeaf(lx, ly, f.leafSide > 0 ? -.5 : Math.PI + .5, 26 * k);
  }

  // flor
  if (f.bloom > 0) {
    const b = easeOutBack(f.bloom);
    const r = f.size * b;
    ctx.save();
    ctx.translate(topX, topY);
    ctx.rotate(Math.sin(t * .8 + f.phase) * .12);
    ctx.fillStyle = f.petal;
    for (let i = 0; i < f.petals; i++) {
      ctx.save();
      ctx.rotate((i / f.petals) * Math.PI * 2 + f.phase);
      ctx.beginPath();
      ctx.ellipse(0, -r * .62, r * .36, r * .62, 0, 0, Math.PI * 2);
      ctx.globalAlpha = .92;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = f.center;
    ctx.beginPath(); ctx.arc(0, 0, r * .3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

/* ---------- Pasto ---------- */
let grass = [];
function makeGrass() {
  grass = Array.from({ length: Math.floor(W / 6) }, (_, i) => ({
    x: i * 6 + rand(-2, 2), h: rand(14, 34), p: rand(0, 6)
  }));
}
function drawGrass(t) {
  ctx.strokeStyle = '#6fb57a';
  ctx.lineWidth = 2;
  for (const g of grass) {
    ctx.beginPath();
    ctx.moveTo(g.x, H);
    ctx.quadraticCurveTo(g.x, H - g.h * .6, g.x + Math.sin(t * 1.5 + g.p) * 5, H - g.h);
    ctx.stroke();
  }
}

/* ---------- Luciérnagas ---------- */
let fireflies = [];
function makeFireflies() {
  fireflies = Array.from({ length: 40 }, () => ({
    x: rand(0, W), y: rand(H * .3, H), a: rand(0, 6), s: rand(.3, .9), p: rand(0, 6)
  }));
}
function drawFireflies(t, alpha) {
  for (const f of fireflies) {
    f.a += rand(-.15, .15);
    f.x += Math.cos(f.a) * f.s; f.y += Math.sin(f.a) * f.s * .7;
    if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
    if (f.y < H * .2) f.y = H; if (f.y > H) f.y = H * .2;
    const glow = (.5 + Math.sin(t * 3 + f.p) * .5) * alpha;
    const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 10);
    grd.addColorStop(0, `rgba(255,245,170,${glow})`);
    grd.addColorStop(1, 'rgba(255,245,170,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- Confeti de corazones ---------- */
let confetti = [];
const CONF_COLORS = ['#ff6f91', '#ffc75f', '#f9a8d4', '#c084fc', '#ffffff', '#fb7185'];
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(-s, -s * .4, -s * .5, -s, 0, -s * .45);
  ctx.bezierCurveTo(s * .5, -s, s, -s * .4, 0, s * .3);
}
function launchConfetti(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), v = rand(4, 13);
    confetti.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      s: rand(6, 13), r: rand(0, 6), vr: rand(-.2, .2),
      c: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)], life: 1
    });
  }
}
function drawConfetti() {
  confetti = confetti.filter(c => c.life > 0 && c.y < H + 30);
  for (const c of confetti) {
    c.vy += .18; c.vx *= .99;
    c.x += c.vx; c.y += c.vy; c.r += c.vr; c.life -= .004;
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.globalAlpha = Math.min(1, c.life * 2);
    ctx.fillStyle = c.c;
    heartPath(c.s); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= Escenas ================= */
function show(id) {
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === id));
}

// saludo letra por letra
const hello = document.getElementById('hello');
[...`Hola, ${NAME}`].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? ' ' : ch;
  s.style.animationDelay = (.3 + i * .09) + 's';
  hello.appendChild(s);
});

let gardenStart = null, fireflyAlpha = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('startBtn').addEventListener('click', async () => {
  show('garden');
  plantFlowers(); makeGrass(); makeFireflies();
  gardenStart = performance.now();
  document.body.classList.add('dusk');

  const msg = document.getElementById('msg');
  await sleep(2500);
  for (const m of MESSAGES) {
    msg.textContent = m;
    msg.classList.add('show');
    await sleep(4200);
    msg.classList.remove('show');
    await sleep(1400);
  }
  document.getElementById('questionText').textContent = QUESTION;
  show('question');
});

/* ---------- Botón "No" que huye ---------- */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
let noCount = 0;
function runAway(e) {
  e.preventDefault();
  noCount++;
  const r = noBtn.getBoundingClientRect();
  if (!noBtn.classList.contains('runaway')) {
    noBtn.style.left = r.left + 'px'; noBtn.style.top = r.top + 'px';
    noBtn.classList.add('runaway');
    noBtn.offsetWidth; // forzar reflow para que la transición funcione
  }
  const pad = 16;
  noBtn.style.left = rand(pad, W - r.width - pad) + 'px';
  noBtn.style.top = rand(pad, H - r.height - pad) + 'px';
  noBtn.textContent = NO_TEXTS[(noCount - 1) % NO_TEXTS.length];
  yesBtn.style.transform = `scale(${Math.min(1 + noCount * .15, 2.2)})`;
}
noBtn.addEventListener('mouseenter', runAway);
noBtn.addEventListener('touchstart', runAway, { passive: false });
noBtn.addEventListener('click', runAway);

yesBtn.addEventListener('click', () => {
  noBtn.style.display = 'none';
  document.getElementById('finalText').textContent = FINAL_TEXT;
  document.getElementById('sign').textContent = SIGN;
  show('final');
  launchConfetti(W / 2, H * .7, 160);
  let bursts = 0;
  const iv = setInterval(() => {
    launchConfetti(rand(W * .15, W * .85), H, 60);
    if (++bursts > 5) clearInterval(iv);
  }, 700);
});

document.getElementById('final').addEventListener('click', e => launchConfetti(e.clientX, e.clientY, 40));

/* ================= Bucle ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (gardenStart !== null) {
    const t = (now - gardenStart) / 1000;
    fireflyAlpha = Math.min(1, t / 8);
    drawFireflies(t, fireflyAlpha);
    for (const f of flowers) drawFlower(f, t, dt);
    drawGrass(t);
  }
  drawConfetti();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<a href="index.html" class="back-to-gifts" style="position:fixed;top:12px;left:12px;z-index:1000;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font:600 14px/1.4 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);cursor:pointer">&larr; regalos</a>
</body>
</html>
