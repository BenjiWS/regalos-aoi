<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Aoi ♥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
        <style>
            :root {
                --night-1: #0b0620;
                --night-2: #2a0f3d;
                --night-3: #5a1845;
                --rose: #ff6b9a;
                --rose-soft: #ffb3c9;
                --gold: #ffd9a0;
                --paper: #fff8f1;
                --ink: #4a2233;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { height: 100%; overflow: hidden; }
            body {
                font-family: 'Cormorant Garamond', Georgia, serif;
                color: #fff;
                background: radial-gradient(ellipse at bottom, var(--night-3) 0%, var(--night-2) 45%, var(--night-1) 100%);
                cursor: default;
                -webkit-tap-highlight-color: transparent;
            }

            canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
            #sky { z-index: 0; }
            #heartCanvas { z-index: 3; pointer-events: none; opacity: 0; transition: opacity 1.5s; }
            #heartCanvas.show { opacity: 1; }

            #petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
            .petal {
                position: absolute; top: -40px;
                animation: fall linear forwards;
                opacity: .85;
            }
            @keyframes fall {
                0%   { transform: translate(0, 0) rotate(0deg); }
                100% { transform: translate(var(--drift), 110vh) rotate(var(--spin)); }
            }

            .scene {
                position: fixed; inset: 0; z-index: 5;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                padding: 24px 16px;
                opacity: 0; visibility: hidden;
                transition: opacity 1.2s ease, visibility 1.2s;
            }
            .scene.active { opacity: 1; visibility: visible; }

           
            .intro-title {
                font-family: 'Great Vibes', cursive;
                font-size: clamp(2.6rem, 9vw, 4.5rem);
                color: var(--rose-soft);
                text-shadow: 0 0 20px rgba(255,107,154,.6);
                margin-bottom: 36px;
                text-align: center;
                animation: glow 3s ease-in-out infinite;
            }
            @keyframes glow {
                0%,100% { text-shadow: 0 0 14px rgba(255,107,154,.5); }
                50%     { text-shadow: 0 0 30px rgba(255,107,154,.95), 0 0 60px rgba(255,107,154,.4); }
            }

            .envelope-wrap { perspective: 900px; cursor: pointer; animation: float 3.5s ease-in-out infinite; }
            @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

            .envelope {
                position: relative; width: min(300px, 78vw); aspect-ratio: 3 / 2;
                background: linear-gradient(160deg, #e8567f, #c13a63);
                border-radius: 6px;
                box-shadow: 0 20px 50px rgba(0,0,0,.45);
            }
            .envelope .pocket {
                position: absolute; inset: 0; z-index: 3; border-radius: 6px;
                background:
                linear-gradient(to top right, #d9456f 50%, transparent 50.5%) left bottom / 50.5% 100% no-repeat,
                linear-gradient(to top left,  #cf3f68 50%, transparent 50.5%) right bottom / 50.5% 100% no-repeat;
            }
            .envelope .flap {
                position: absolute; top: 0; left: 0; width: 100%; height: 62%; z-index: 4;
                transform-origin: top;
                transition: transform .8s ease, z-index 0s .4s;
            }
            .envelope .flap::before {
                content: ""; position: absolute; inset: 0;
                background: linear-gradient(180deg, #f06a92, #d9456f);
                clip-path: polygon(0 0, 100% 0, 50% 100%);
                border-radius: 6px 6px 0 0;
            }
            .envelope .seal {
                position: absolute; left: 50%; top: 52%; z-index: 5;
                transform: translate(-50%, -50%);
                font-size: 2.2rem; color: #fff;
                filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
                animation: beat 1.3s ease-in-out infinite;
                transition: opacity .3s;
            }
            @keyframes beat { 0%,100% { transform: translate(-50%,-50%) scale(1); } 15% { transform: translate(-50%,-50%) scale(1.2); } 30% { transform: translate(-50%,-50%) scale(1); } 45% { transform: translate(-50%,-50%) scale(1.12); } }
            .envelope .paper {
                position: absolute; left: 7%; right: 7%; top: 8%; bottom: 6%; z-index: 2;
                background: var(--paper); border-radius: 4px;
                display: flex; align-items: center; justify-content: center;
                font-family: 'Great Vibes', cursive; color: var(--rose); font-size: 2rem;
                transition: transform 1s ease .5s;
            }
            .envelope.open .flap { transform: rotateX(180deg); z-index: 1; }
            .envelope.open .seal { opacity: 0; }
            .envelope.open .paper { transform: translateY(-65%); }

            .hint {
                margin-top: 34px; font-style: italic; font-size: 1.15rem; letter-spacing: .05em;
                color: rgba(255,255,255,.75);
                animation: blink 2.2s ease-in-out infinite;
            }
            @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

        
            .letter {
                position: relative;
                width: min(620px, 100%);
                max-height: 86vh; overflow-y: auto;
                background: var(--paper);
                color: var(--ink);
                border-radius: 10px;
                padding: clamp(26px, 6vw, 48px);
                box-shadow: 0 25px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,179,201,.4);
                transform: translateY(30px) scale(.96);
                transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
            }
            .scene.active .letter { transform: none; }
            .letter::before {
                content: "♥"; position: absolute; top: 14px; right: 20px;
                color: var(--rose); font-size: 1.4rem; opacity: .6;
            }
            .letter h2 {
                font-family: 'Great Vibes', cursive; font-weight: 400;
                font-size: clamp(2.4rem, 8vw, 3.2rem); color: var(--rose);
                margin-bottom: 14px;
            }
            .letter p {
                font-size: clamp(1.15rem, 3.8vw, 1.35rem); line-height: 1.6;
                margin-bottom: 14px; min-height: 1em;
            }
            .cursor {
                display: inline-block; width: 2px; height: 1.1em; background: var(--rose);
                vertical-align: text-bottom; margin-left: 2px;
                animation: caret .8s steps(1) infinite;
            }
            @keyframes caret { 50% { opacity: 0; } }
            .skip { font-size: .9rem; color: #b48a99; font-style: italic; text-align: right; margin-top: 4px; }

            .btn {
                display: block; margin: 22px auto 0;
                font-family: inherit; font-size: 1.25rem; font-weight: 600;
                color: #fff; background: linear-gradient(135deg, var(--rose), #d63c6e);
                border: none; border-radius: 999px; padding: 12px 30px;
                cursor: pointer; box-shadow: 0 8px 24px rgba(214,60,110,.45);
                opacity: 0; transform: translateY(10px); pointer-events: none;
                transition: opacity .8s, transform .8s, box-shadow .3s;
            }
            .btn.show { opacity: 1; transform: none; pointer-events: auto; animation: pulse 2s ease-in-out infinite 1s; }
            .btn:hover { box-shadow: 0 10px 34px rgba(255,107,154,.75); }
            @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }


            #final { justify-content: flex-end; padding-bottom: 8vh; }
            .love {
                font-family: 'Great Vibes', cursive;
                font-size: clamp(3rem, 12vw, 6rem);
                color: #fff; text-align: center; line-height: 1.1;
                text-shadow: 0 0 18px var(--rose), 0 0 40px var(--rose);
                opacity: 0; transform: scale(.8);
                transition: opacity 2s ease 1.8s, transform 2s ease 1.8s;
            }
            #final.active .love { opacity: 1; transform: none; }
            .reasons {
                margin-top: 18px; min-height: 3.4em; max-width: 560px;
                text-align: center; font-style: italic;
                font-size: clamp(1.15rem, 4vw, 1.45rem); color: var(--gold);
                opacity: 0; transition: opacity .9s ease;
            }
            .reasons.show { opacity: 1; }
            .small { margin-top: 10px; font-size: .95rem; color: rgba(255,255,255,.55); font-style: italic; opacity: 0; transition: opacity 1.5s ease 5s; }
            #final.active .small { opacity: 1; }

            .burst {
                position: fixed; z-index: 10; pointer-events: none;
                color: var(--rose); font-size: 18px;
                animation: burst 1.2s ease-out forwards;
            }
            @keyframes burst {
                0%   { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
                100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
            }
        </style>
    </head>
    <body>

    <canvas id="sky"></canvas>
    <div id="petals"></div>
    <canvas id="heartCanvas"></canvas>


    <section class="scene active" id="intro">
        <h1 class="intro-title">Para ti, Aoi</h1>
        <div class="envelope-wrap" id="envelopeWrap" role="button" aria-label="Abrir el sobre" tabindex="0">
            <div class="envelope" id="envelope">
            <div class="paper">Aoi ♥</div>
            <div class="pocket"></div>
            <div class="flap"></div>
            <div class="seal">♥</div>
            </div>
        </div>
        <p class="hint">toca el sobre</p>
    </section>


    <section class="scene" id="carta">
    <div class="letter" id="letter">
        <h2>Mi querida Aoi,</h2>
        <div id="text"></div>
        <p class="skip" id="skip">toca la carta para leer más rápido</p>
        <button class="btn" id="nextBtn">Una cosa más ♥</button>
    </div>
    </section>


    <section class="scene" id="final">
        <div class="love">Te Quiero Aoi</div>
        <p class="reasons" id="reasons"></p>
        <p class="small">toca la pantalla ♥</p>
    </section>

        <script>
        
            const LETTER = [
                "No sé exactamente en qué momento pasó, pero un día me di cuenta de que mi lugar favorito en el mundo es cualquiera donde estés tú.",
                "Me encanta tu risa, tu forma de ver las cosas y la calma que me das sin siquiera intentarlo. Contigo, hasta los días más normales se sienten especiales.",
                "Gracias por existir, por elegirme y por hacer que mi corazón se sienta en casa.",
                "Hice esta pequeña página solo para recordarte algo que quiero que nunca olvides…"
            ];
            const REASONS = [
                "Porque tu sonrisa ilumina mis días.",
                "Porque contigo todo es más bonito.",
                "Porque eres mi paz y mi aventura al mismo tiempo.",
                "Porque me haces querer ser mejor cada día.",
                "Porque tu voz es mi sonido favorito.",
                "Porque cada momento contigo es un recuerdo que guardo.",
                "Porque eres tú, y eso es suficiente."
            ];


            const sky = document.getElementById('sky');
            const sctx = sky.getContext('2d');
            let W, H, DPR, stars = [], shooting = [];
            function resize() 
            {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth; H = window.innerHeight;
                [sky, heartCanvas].forEach(c => {
                    c.width = W * DPR; c.height = H * DPR;
                    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
                });
                stars = Array.from({ length: Math.floor(W * H / 3500) }, () => ({
                    x: Math.random() * W, y: Math.random() * H,
                    r: Math.random() * 1.3 + .2,
                    p: Math.random() * Math.PI * 2,
                    s: Math.random() * .02 + .005
                }));
                if (heartActive) buildHeartTargets();
            }
            function drawSky() 
            {
                sctx.clearRect(0, 0, W, H);
                for (const s of stars) {
                    s.p += s.s;
                    sctx.globalAlpha = .35 + Math.sin(s.p) * .35 + .3;
                    sctx.fillStyle = '#fff';
                    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
                }
                if (Math.random() < .006) {
                    shooting.push({ x: Math.random() * W * .8, y: Math.random() * H * .4, vx: 7 + Math.random() * 4, vy: 3 + Math.random() * 2, life: 1 });
                }
                shooting = shooting.filter(m => m.life > 0);
                for (const m of shooting) {
                    const g = sctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
                    g.addColorStop(0, `rgba(255,255,255,${m.life})`);
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    sctx.globalAlpha = 1; sctx.strokeStyle = g; sctx.lineWidth = 2;
                    sctx.beginPath(); sctx.moveTo(m.x, m.y); sctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12); sctx.stroke();
                    m.x += m.vx; m.y += m.vy; m.life -= .015;
                }
                sctx.globalAlpha = 1;
            }


            const petals = document.getElementById('petals');
            const PETAL_SHAPES = ['❤', '❀', '♥', '✿', '❥'];
            const PETAL_COLORS = ['#ff8fb1', '#ffc1d3', '#ff6b9a', '#ffd9e4', '#f7a1c4'];
            function spawnPetal() 
            {
                const el = document.createElement('span');
                el.className = 'petal';
                el.textContent = PETAL_SHAPES[Math.floor(Math.random() * PETAL_SHAPES.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (10 + Math.random() * 18) + 'px';
                el.style.color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
                el.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
                el.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
                const dur = 7 + Math.random() * 8;
                el.style.animationDuration = dur + 's';
                petals.appendChild(el);
                setTimeout(() => el.remove(), dur * 1000);
            }
            setInterval(spawnPetal, 450);


            function burst(x, y, n = 12) 
            {
                for (let i = 0; i < n; i++) 
                {
                    const el = document.createElement('span');
                    el.className = 'burst';
                    el.textContent = Math.random() < .7 ? '♥' : '✦';
                    el.style.left = x + 'px'; el.style.top = y + 'px';
                    el.style.color = PETAL_COLORS[i % PETAL_COLORS.length];
                    el.style.fontSize = (12 + Math.random() * 16) + 'px';
                    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 90;
                    el.style.setProperty('--dx', Math.cos(a) * d + 'px');
                    el.style.setProperty('--dy', Math.sin(a) * d + 'px');
                    el.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 1200);
                }
            }

            function show(id) 
            {
                document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.id === id));
            }

            const envelope = document.getElementById('envelope');
            const envelopeWrap = document.getElementById('envelopeWrap');
            let opened = false;
            function openEnvelope(e) 
            {
                if (opened) return;
                opened = true;
                envelope.classList.add('open');
                const r = envelope.getBoundingClientRect();
                burst(r.left + r.width / 2, r.top + r.height / 2, 22);
                setTimeout(() => { show('carta'); startTyping(); }, 2000);
            }
            envelopeWrap.addEventListener('click', openEnvelope);
            envelopeWrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openEnvelope(); });


            const textBox = document.getElementById('text');
            const nextBtn = document.getElementById('nextBtn');
            const skipHint = document.getElementById('skip');
            let fast = false;
            document.getElementById('letter').addEventListener('click', e => { if (e.target !== nextBtn) fast = true; });

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            async function startTyping() 
            {
                await sleep(900);
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                for (const para of LETTER) 
                {
                    const p = document.createElement('p');
                    textBox.appendChild(p);
                    const node = document.createTextNode('');
                    p.append(node, cursor);
                    for (const ch of para) {
                    node.data += ch;
                    if (!fast) await sleep(ch === ',' ? 160 : ch === '.' || ch === '…' ? 320 : 38);
                    }
                    if (!fast) await sleep(500);
                }
                cursor.remove();
                skipHint.style.display = 'none';
                nextBtn.classList.add('show');
            }

            nextBtn.addEventListener('click', e => {
            burst(e.clientX, e.clientY, 18);
            show('final');
            startHeart();
            startReasons();
            });


            const heartCanvas = document.getElementById('heartCanvas');
            const hctx = heartCanvas.getContext('2d');
            let heartActive = false, particles = [], targets = [];

            function heartPoint(t) 
            {
                return {
                    x: 16 * Math.pow(Math.sin(t), 3),
                    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
                };
            }

            function buildHeartTargets() 
            {
                const scale = Math.min(W, H) / 42;
                const cx = W / 2, cy = H * 0.4;
                targets = [];
                const N = W < 600 ? 520 : 900;
                for (let i = 0; i < N; i++) {
                    const t = Math.random() * Math.PI * 2;
                    const p = heartPoint(t);
                    const k = i % 3 === 0 ? Math.sqrt(Math.random()) : 1 - Math.random() * .06;
                    targets.push({ x: cx + p.x * scale * k, y: cy + p.y * scale * k });
                }
                if (particles.length !== targets.length) {
                    particles = targets.map(() => ({
                    x: Math.random() * W, y: Math.random() * H,
                    r: Math.random() * 1.8 + .6,
                    hue: 330 + Math.random() * 30,
                    light: 60 + Math.random() * 25,
                    tw: Math.random() * Math.PI * 2
                    }));
                }
            }
            function startHeart() 
            {
                heartActive = true;
                buildHeartTargets();
                heartCanvas.classList.add('show');
                }
                let beatT = 0;
                function drawHeart() {
                hctx.clearRect(0, 0, W, H);
                beatT += 0.045;
                const b = 1 + Math.pow(Math.max(0, Math.sin(beatT)), 12) * 0.08;
                const cx = W / 2, cy = H * 0.4;
                hctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i], t = targets[i];
                    const tx = cx + (t.x - cx) * b, ty = cy + (t.y - cy) * b;
                    p.x += (tx - p.x) * 0.04 + (Math.random() - .5) * .6;
                    p.y += (ty - p.y) * 0.04 + (Math.random() - .5) * .6;
                    p.tw += .08;
                    const a = .55 + Math.sin(p.tw) * .35;
                    hctx.fillStyle = `hsla(${p.hue}, 100%, ${p.light}%, ${a})`;
                    hctx.beginPath(); hctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); hctx.fill();
                }
                hctx.globalCompositeOperation = 'source-over';
            }

            const reasonsEl = document.getElementById('reasons');
            function startReasons() 
            {
                let i = 0;
                const next = () => {
                    reasonsEl.classList.remove('show');
                    setTimeout(() => {
                    reasonsEl.textContent = REASONS[i++ % REASONS.length];
                    reasonsEl.classList.add('show');
                    }, 900);
                };
                setTimeout(() => { next(); setInterval(next, 4500); }, 3800);
            }

            document.getElementById('final').addEventListener('click', e => burst(e.clientX, e.clientY, 14));


            function loop() 
            {
                drawSky();
                if (heartActive) drawHeart();
                requestAnimationFrame(loop);
            }
            window.addEventListener('resize', resize);
            resize();
            loop();
        </script>
<a href="index.html" class="back-to-gifts" style="position:fixed;top:12px;left:12px;z-index:1000;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font:600 14px/1.4 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);cursor:pointer">&larr; regalos</a>
    </body>
</html>
